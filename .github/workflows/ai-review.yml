name: ai-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: ai-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/ai-review/go.mod
          cache-dependency-path: tools/ai-review/go.mod

      - name: Build trusted reviewer
        run: go -C tools/ai-review build -o "$RUNNER_TEMP/ai-review" .

      - name: Fetch PR head as data only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$HEAD_SHA"

      - name: Find and safely download compatible main index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH="$("$RUNNER_TEMP/ai-review" hash -root .)"
          python3 tools/ai-review/artifact.py download --repo VaSeWS/iRon_fork --hash "$HASH" --out "$RUNNER_TEMP/index.json"

      - name: Publish AI review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
        run: >-
          "$RUNNER_TEMP/ai-review" review
          -root .
          -index "$RUNNER_TEMP/index.json"
          -repo "$GH_REPO"
          -pr "$PR_NUMBER"
          -base "$BASE_SHA"
          -head "$HEAD_SHA"
          -publish
          -out "$RUNNER_TEMP/review.md"
